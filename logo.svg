<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main Container -->
  <rect x="20" y="20" width="160" height="160" rx="35" fill="url(#grad5)" opacity="0.08" stroke="url(#grad5)" stroke-width="1.5"/>
  
  <!-- Picture/Image Icon (Solid) -->
  <g transform="translate(100, 100)">
    <!-- Main Frame -->
    <rect x="-50" y="-50" width="100" height="100" rx="12" fill="none" stroke="url(#grad5)" stroke-width="3"/>
    
    <!-- Photo Indicator Corner -->
    <circle cx="-35" cy="-35" r="8" fill="url(#grad5)"/>
    
    <!-- Landscape/Mountain Path -->
    <path d="M -50 20 L -20 -10 L 0 10 L 30 -15 L 50 20" fill="url(#grad5)" opacity="0.25"/>
    
    <!-- Landscape Line -->
    <path d="M -50 20 L -20 -10 L 0 10 L 30 -15 L 50 20" stroke="url(#grad5)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Sky Gradient Indicator -->
    <rect x="-50" y="-50" width="100" height="70" fill="url(#grad5)" opacity="0.08" rx="10"/>
  </g>
</svg>